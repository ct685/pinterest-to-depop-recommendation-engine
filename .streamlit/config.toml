# Theme for Transpose.
# Neutral: white page, warm paper-gray panels, black as the only accent. A muted red is
# reserved for the Depop buttons (styled in app/streamlit_app.py, not here).
# Type: Cormorant Garamond for headings, EB Garamond for everything else.
# Docs: https://docs.streamlit.io/develop/api-reference/configuration/config.toml
#
# NOTE: every scalar [theme] key must appear BEFORE the [[theme.fontFaces]]
# array-of-tables below — TOML assigns any key after an array-of-tables to that
# table, and Streamlit then rejects the whole config.

[theme]
base = "light"

primaryColor = "#111111"               # ink — primary button, active tab, slider, focus
backgroundColor = "#ffffff"            # page
secondaryBackgroundColor = "#f4f4f2"   # paper gray — sidebar, inputs, panels
textColor = "#111111"
linkColor = "#111111"
linkUnderline = true
borderColor = "#e3e3e0"                # hairline rules

font = "'EB Garamond', Garamond, 'Times New Roman', serif"
headingFont = "'Cormorant Garamond', 'EB Garamond', Garamond, serif"
codeFont = "ui-monospace, 'SF Mono', Menlo, monospace"
baseFontSize = 17                      # Garamond runs small; bump one step

baseRadius = "none"                    # square corners suit the editorial look
buttonRadius = "none"
showWidgetBorder = true
showSidebarBorder = true

chartCategoricalColors = ["#111111", "#6b6b68", "#a8a8a4", "#3a3a38", "#c9c9c5"]

[[theme.fontFaces]]
family = "Cormorant Garamond"
url = "https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@5/files/cormorant-garamond-latin-500-normal.woff2"
weight = 500
style = "normal"

[[theme.fontFaces]]
